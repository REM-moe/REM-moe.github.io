# Blog settings. The portfolio (index.html at the root) is left exactly as it is;
# everything the blog adds lives under /blog/.
title: Abhay
description: A notebook of experiences, things I learned, and things I still can't answer.
permalink: /blog/:title/
markdown: kramdown
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
