# The blog is the home page. The older portfolio lives at /portfolio/.
title: Abhay
description: A notebook of experiences, things I learned, and things I still can't answer.
permalink: /:title/
markdown: kramdown
# The editor writes one line per paragraph, so a single line break must count (see _layouts/post.html).
kramdown:
  input: GFM
  hard_wrap: true
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
